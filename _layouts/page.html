---
layout: default
---
<div class="wrap page">
  <div class="page__head">
    <p class="kicker">{{ page.section | default: "Section" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.standfirst %}<p>{{ page.standfirst }}</p>{% endif %}
  </div>

  <div class="prose{% if page.wide %} prose--wide{% endif %}">
    {{ content }}
  </div>
</div>
