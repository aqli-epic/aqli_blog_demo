<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {%- comment -%}
      Set before first paint. Only controls that need JavaScript to do anything
      are gated on it — see .filter-box in main.css.
    {%- endcomment -%}
    <script>document.documentElement.classList.add('js');</script>
    {% include head.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
