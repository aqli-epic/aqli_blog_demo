name: Deploy to GitHub Pages

# Requires: Settings → Pages → Source: "GitHub Actions".
#
# The legacy "Deploy from a branch" builder pins Jekyll 3.9 via the github-pages
# gem, whose Liquid calls Object#tainted? — removed in Ruby 3.2. Building here
# instead lets the site run current Jekyll, and means what deploys is byte-for-byte
# what CI checked.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # Take baseurl and url from the Pages deployment itself rather than from
      # _config.yml, so a rename of the repository cannot 404 the whole site.
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --trace \
            --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
