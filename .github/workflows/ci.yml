name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # HTMLProofer parses through Nokogiri, which honours Encoding.default_external.
  # Under a non-UTF-8 locale every page fails to parse with
  # `Encoding::InvalidByteSequenceError` — and HTMLProofer still exits 0, having
  # checked nothing. The site is full of µ, β and en dashes, so this is not
  # optional.
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Lint posts against the editorial contract
        run: ruby script/lint-posts.rb

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      # baseurl is read from _config.yml rather than hardcoded, so the two cannot
      # drift apart. Getting baseurl wrong is the single most common way a Pages
      # site breaks, and it breaks every link at once.
      - name: Check links and markup
        run: |
          set -euo pipefail
          BASEURL="$(ruby -ryaml -e 'print YAML.load_file("_config.yml")["baseurl"].to_s')"
          echo "Proofing with baseurl: ${BASEURL:-(none)}"

          bundle exec htmlproofer _site \
            --disable-external \
            --allow-hash-href \
            --checks Links,Images,Scripts,OpenGraph \
            --swap-urls "^${BASEURL}:" \
            2>&1 | grep -Ev '^\{"time"' | tee proofer.log

          # HTMLProofer exits 0 when it parsed nothing at all. Without this the
          # job passes green on a site where every single page failed to load.
          LINKS="$(grep -oE 'Checking [0-9]+ internal links' proofer.log | grep -oE '[0-9]+' || echo 0)"
          echo "Internal links checked: $LINKS"
          if [ "$LINKS" -eq 0 ]; then
            echo "::error::HTMLProofer checked 0 internal links — it parsed nothing. Treating as failure."
            exit 1
          fi

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
