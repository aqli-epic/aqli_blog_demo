name: Site problem
description: Something on the site is broken, wrong, or unreadable
labels: ["bug"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem
      options:
        - A figure or calculation looks wrong
        - A link, page or asset 404s
        - Layout or typography is broken
        - Accessibility barrier
        - Build failure
        - Something else
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where
      description: The URL, or the file if it is a build problem.
      placeholder: /blog/2026/07/14/…  or  _includes/ruler.html
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: Only if it is a rendering problem.
      placeholder: Safari 18, iPhone

  - type: markdown
    attributes:
      value: |
        **If a figure looks wrong**, check whether it is derived or typed. Standing figures live in
        `_config.yml` (`who_guideline`, `aqli_coefficient`); a wrong number in one place and a right
        one elsewhere usually means a post typed a constant instead of referencing it.
