<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Air Quality Life Index — air pollution, translated into years of life">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- the masthead's double rule -->
  <rect x="80" y="92" width="1040" height="4" fill="#14140f"/>
  <rect x="80" y="102" width="1040" height="1" fill="#14140f"/>

  <text x="80" y="76" font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="2.6" fill="#7d7d75">THE AIR QUALITY LIFE INDEX</text>

  <text x="80" y="222" font-family="Newsreader,'Iowan Old Style',Georgia,serif" font-size="82" font-weight="600" letter-spacing="-2" fill="#14140f">Air pollution, translated</text>
  <text x="80" y="308" font-family="Newsreader,'Iowan Old Style',Georgia,serif" font-size="82" font-weight="600" letter-spacing="-2" fill="#14140f">into years of life.</text>

  <!-- the exposure ruler: bands proportional to their µg/m³ range, 0–100 -->
  <g transform="translate(80,430)">
    <text x="0" y="-46" font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="17" font-weight="500" letter-spacing="2.2" fill="#7d7d75">ANNUAL MEAN PM2.5, µg/m³</text>

    <rect x="0"     y="0" width="52"  height="26" fill="#f2ead1"/>
    <rect x="52"    y="0" width="104" height="26" fill="#edd287"/>
    <rect x="156"   y="0" width="156" height="26" fill="#e5a94c"/>
    <rect x="312"   y="0" width="208" height="26" fill="#d9762c"/>
    <rect x="520"   y="0" width="260" height="26" fill="#bc3a22"/>
    <rect x="780"   y="0" width="260" height="26" fill="#8e1230"/>
    <rect x="0" y="0" width="1040" height="26" fill="none" stroke="#14140f" stroke-width="2"/>

    <!-- WHO guideline at 5 µg/m³ -->
    <rect x="51" y="-9" width="3" height="44" fill="#14140f"/>
    <text x="60" y="-16" font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="17" fill="#4c4c46">WHO 5</text>

    <!-- a district at 55 µg/m³ -->
    <rect x="571" y="-9" width="3" height="44" fill="#14140f"/>
    <text x="580" y="-16" font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#14140f">A district at 55</text>

    <text x="0"    y="52" font-family="'IBM Plex Mono',Menlo,monospace" font-size="16" fill="#7d7d75">0</text>
    <text x="260"  y="52" font-family="'IBM Plex Mono',Menlo,monospace" font-size="16" fill="#7d7d75">25</text>
    <text x="520"  y="52" font-family="'IBM Plex Mono',Menlo,monospace" font-size="16" fill="#7d7d75">50</text>
    <text x="780"  y="52" font-family="'IBM Plex Mono',Menlo,monospace" font-size="16" fill="#7d7d75">75</text>
    <text x="962"  y="52" font-family="'IBM Plex Mono',Menlo,monospace" font-size="16" fill="#7d7d75">100+</text>
  </g>

  <text x="80" y="576" font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="19" fill="#4c4c46">Evidence-led reporting on particulate pollution, life expectancy and clean-air policy.</text>
</svg>
